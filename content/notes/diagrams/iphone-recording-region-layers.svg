<!-- Source of public/notes/iphone-recording-region-layers.png (rendered at 2x with headless Chrome). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" width="640" height="452" role="img" aria-labelledby="t d" font-family="Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title id="t">A recording sees the cover, not the copy</title>
  <desc id="d">Two stacks of the same three pieces, top to bottom: the copy of the card, the black cover and the live card. On your screen you see the copy. In the recording the copy is left out, so only the black cover shows.</desc>
  <rect width="640" height="452" fill="#fafafa"/>

  <text x="24" y="40" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#09090b">A recording sees the cover, not the copy</text>
  <text x="24" y="66" font-size="15" fill="#71717a">Stacked top to bottom · dark = what each viewer sees</text>

  <text x="166" y="114" text-anchor="middle" font-size="19" font-weight="700" fill="#09090b">On your screen</text>
  <text x="474" y="114" text-anchor="middle" font-size="19" font-weight="700" fill="#09090b">In the recording</text>

  <!-- On your screen -->
  <rect x="24" y="130" width="284" height="76" rx="12" fill="#09090b"/>
  <text x="44" y="162" font-size="19" font-weight="700" fill="#fafafa">Copy of the card</text>
  <text x="44" y="188" font-size="16" fill="#a1a1aa">native iOS view, protected</text>

  <rect x="24.75" y="218.75" width="282.5" height="74.5" rx="12" fill="none" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="44" y="250" font-size="19" font-weight="700" fill="#09090b">Black cover</text>
  <text x="44" y="276" font-size="16" fill="#71717a">hidden under the copy</text>

  <rect x="24.75" y="306.75" width="282.5" height="74.5" rx="12" fill="none" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="44" y="338" font-size="19" font-weight="700" fill="#09090b">Live card</text>
  <text x="44" y="364" font-size="16" fill="#71717a">still gets taps and typing</text>

  <!-- In the recording -->
  <rect x="332.75" y="130.75" width="282.5" height="74.5" rx="12" fill="none" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="352" y="162" font-size="19" font-weight="700" fill="#a1a1aa">Copy of the card</text>
  <text x="352" y="188" font-size="16" fill="#a1a1aa">left out of the capture</text>

  <rect x="332" y="218" width="284" height="76" rx="12" fill="#09090b"/>
  <text x="352" y="250" font-size="19" font-weight="700" fill="#fafafa">Black cover</text>
  <text x="352" y="276" font-size="16" fill="#a1a1aa">what the recording shows</text>

  <rect x="332.75" y="306.75" width="282.5" height="74.5" rx="12" fill="none" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="352" y="338" font-size="19" font-weight="700" fill="#09090b">Live card</text>
  <text x="352" y="364" font-size="16" fill="#71717a">hidden under the cover</text>

  <text x="166" y="422" text-anchor="middle" font-size="16" fill="#3f3f46">You see the copy</text>
  <text x="474" y="422" text-anchor="middle" font-size="16" fill="#3f3f46">The video shows the cover</text>
</svg>
